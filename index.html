<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#10b981" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinanceFlow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="FinanceFlow" />
    <meta name="description" content="Plataforma de gestão financeira pessoal e controle patrimonial" />
    <title>FinanceFlow</title>
    <script>
      // Aplica o tema antes do primeiro paint (evita flash). Dark é o padrão.
      // Manter a chave em sincronia com THEME_STORAGE_KEY em src/lib/theme.ts.
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('financeflow-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {}
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
