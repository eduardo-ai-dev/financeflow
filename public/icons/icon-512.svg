<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1713" />
      <stop offset="100%" stop-color="#050806" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="6" />

  <!-- Stylized Financial Growth Symbol -->
  <g filter="url(#glow)">
    <!-- Upward Trend Line -->
    <path
      d="M 118 346 L 202 262 L 278 310 L 394 166"
      fill="none"
      stroke="url(#primary)"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Arrow Head -->
    <path
      d="M 330 166 L 394 166 L 394 230"
      fill="none"
      stroke="url(#primary)"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Node Dots -->
  <circle cx="118" cy="346" r="18" fill="#34d399" />
  <circle cx="202" cy="262" r="18" fill="#34d399" />
  <circle cx="278" cy="310" r="18" fill="#34d399" />
  <circle cx="394" cy="166" r="22" fill="#10b981" stroke="#ffffff" stroke-width="6" />
</svg>

