<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1713" />
      <stop offset="100%" stop-color="#050806" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Background for Maskable Icon -->
  <rect width="512" height="512" fill="url(#bg)" />

  <!-- Safe Zone Graphic (Within 80% center circle) -->
  <g filter="url(#glow)">
    <path
      d="M 138 330 L 212 256 L 278 298 L 374 182"
      fill="none"
      stroke="url(#primary)"
      stroke-width="28"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 318 182 L 374 182 L 374 238"
      fill="none"
      stroke="url(#primary)"
      stroke-width="28"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Node Dots -->
  <circle cx="138" cy="330" r="16" fill="#34d399" />
  <circle cx="212" cy="256" r="16" fill="#34d399" />
  <circle cx="278" cy="298" r="16" fill="#34d399" />
  <circle cx="374" cy="182" r="20" fill="#10b981" stroke="#ffffff" stroke-width="5" />
</svg>

