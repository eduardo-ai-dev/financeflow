<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1713" />
      <stop offset="100%" stop-color="#050806" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bg)" />
  <rect width="190" height="190" x="1" y="1" rx="41" fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="2" />

  <!-- Stylized Financial Growth Symbol -->
  <g filter="url(#glow)">
    <!-- Upward Trend Line -->
    <path
      d="M 44 130 L 76 98 L 104 116 L 148 62"
      fill="none"
      stroke="url(#primary)"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Arrow Head -->
    <path
      d="M 124 62 L 148 62 L 148 86"
      fill="none"
      stroke="url(#primary)"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Node Dots -->
  <circle cx="44" cy="130" r="7" fill="#34d399" />
  <circle cx="76" cy="98" r="7" fill="#34d399" />
  <circle cx="104" cy="116" r="7" fill="#34d399" />
  <circle cx="148" cy="62" r="8" fill="#10b981" stroke="#ffffff" stroke-width="2.5" />
</svg>
